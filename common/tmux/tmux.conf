unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

setw -g mode-keys vi

# ── colour: true colour through kitty ──────────────────────────────
set -g default-terminal 'tmux-256color'
set -as terminal-features 'xterm*:RGB'

# ── palette: GitHub Light (matches kitty current-theme.conf) ───────
#   bg      #ffffff   fg      #24292f   bar     #f6f8fa   line  #d0d7de
#   muted   #8c959f   dim     #57606a   blue    #0969da   red   #cf222e
#   amber   #9a6700   find    #fff8c5   hit     #d4a72c

# ── status bar ─────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#f6f8fa,fg=#57606a'
set -g status-left-length 40
set -g status-right-length 60
setw -g window-status-separator ''

# session pill turns red while the prefix is held
set -g status-left '#{?client_prefix,#[bg=#cf222e],#[bg=#0969da]}#[fg=#ffffff,bold] #S #[default]  '

setw -g window-status-format         '#[fg=#8c959f] #I #[fg=#57606a]#W#[fg=#8c959f]#F '
setw -g window-status-current-format '#[bg=#ffffff,fg=#0969da,bold] #I #[fg=#24292f]#W#[fg=#cf222e]#F '
setw -g window-status-activity-style 'fg=#9a6700'
setw -g window-status-bell-style     'fg=#cf222e,bold'

set -g status-right '#[fg=#8c959f]%d %b  #[fg=#24292f,bold]%H:%M '

# ── panes & messages ───────────────────────────────
set -g pane-border-style        'fg=#d0d7de'
set -g pane-active-border-style 'fg=#0969da'
set -g display-panes-colour        '#8c959f'
set -g display-panes-active-colour '#0969da'
set -g message-style         'bg=#0969da,fg=#ffffff'
set -g message-command-style 'bg=#24292f,fg=#ffffff'
set -g mode-style            'bg=#0969da,fg=#ffffff'
set -g copy-mode-match-style         'bg=#fff8c5,fg=#24292f'
set -g copy-mode-current-match-style 'bg=#d4a72c,fg=#24292f'
setw -g clock-mode-colour '#0969da'

set-option -g history-limit 50000

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5

# ── behaviour ─────────────────────────────────────
set -g set-clipboard on
set -g focus-events on
set -g display-time 2000

# ── popups (prefix-based menus, choose-tree) ──────────────
set -g popup-style        'bg=#ffffff,fg=#24292f'
set -g popup-border-style 'fg=#8c959f'
set -g menu-style          'bg=#ffffff,fg=#24292f'
set -g menu-selected-style 'bg=#0969da,fg=#ffffff'
set -g menu-border-style   'fg=#8c959f'
