unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

setw -g mode-keys vi

# ── colour: true colour through kitty ──────────────────────────────
set -g default-terminal 'tmux-256color'
set -as terminal-features 'xterm*:RGB'

# ── palette: Sequoia Retro Light (matches kitty current-theme.conf) ─
#   bg      #edeef2   fg      #282930   bar     #e0e1e7   line  #d4d5dc
#   muted   #817c9c   dim     #42434e   blue    #456a82   rust  #bf5238
#   ochre   #c99730   green   #4a704e   select  #d5d5df

# ── status bar ─────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#e0e1e7,fg=#42434e'
set -g status-left-length 40
set -g status-right-length 60
setw -g window-status-separator ''

# session pill turns rust while the prefix is held
set -g status-left '#{?client_prefix,#[bg=#bf5238],#[bg=#456a82]}#[fg=#edeef2,bold] #S #[default]  '

setw -g window-status-format         '#[fg=#817c9c] #I #[fg=#42434e]#W#[fg=#817c9c]#F '
setw -g window-status-current-format '#[bg=#edeef2,fg=#456a82,bold] #I #[fg=#282930]#W#[fg=#bf5238]#F '
setw -g window-status-activity-style 'fg=#c99730'
setw -g window-status-bell-style     'fg=#bf5238,bold'

set -g status-right '#[fg=#817c9c]%d %b  #[fg=#282930,bold]%H:%M '

# ── panes & messages ───────────────────────────────
set -g pane-border-style        'fg=#d4d5dc'
set -g pane-active-border-style 'fg=#456a82'
set -g display-panes-colour        '#817c9c'
set -g display-panes-active-colour '#456a82'
set -g message-style         'bg=#456a82,fg=#edeef2'
set -g message-command-style 'bg=#282930,fg=#edeef2'
set -g mode-style            'bg=#d5d5df,fg=#282930'
set -g copy-mode-match-style         'bg=#e8d9b0,fg=#282930'
set -g copy-mode-current-match-style 'bg=#c99730,fg=#edeef2'
setw -g clock-mode-colour '#456a82'

set-option -g history-limit 50000

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5

# ── behaviour ─────────────────────────────────────
set -g set-clipboard on
set -g focus-events on
set -g display-time 2000

# ── popups (prefix-based menus, choose-tree) ──────────────
set -g popup-style        'bg=#edeef2,fg=#282930'
set -g popup-border-style 'fg=#817c9c'
set -g menu-style          'bg=#edeef2,fg=#282930'
set -g menu-selected-style 'bg=#456a82,fg=#edeef2'
set -g menu-border-style   'fg=#817c9c'
