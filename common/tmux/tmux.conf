unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

setw -g mode-keys vi

# ── status bar (theme-agnostic: uses ANSI indices, not hex) ─────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default,fg=colour8'
set -g status-left-length 40
set -g status-right-length 60
setw -g window-status-separator ''

set -g status-left '#[fg=blue,bold] #S   '

setw -g window-status-format         ' #[fg=colour8]#I:#W#F  '
setw -g window-status-current-format ' #[fg=cyan,bold]#I:#[fg=colour15,bold]#W#[fg=cyan]#F  '

set -g status-right '#[fg=colour8]%H:%M  %d %b '

# ── panes & messages ───────────────────────────────
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=blue'
set -g message-style 'bg=default,fg=blue'
set -g mode-style 'bg=blue,fg=black'

set-option -g history-limit 50000

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5

# ── behaviour ─────────────────────────────────────
set -g set-clipboard on
set -g focus-events on
set -g display-time 2000

# ── popups (prefix-based menus, choose-tree) ──────────────
set -g popup-border-style 'fg=colour8'
set -g popup-style 'bg=default'
